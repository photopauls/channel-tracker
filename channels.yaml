# List every channel you want tracked here.
#
# Just paste the channel's URL — any format works: /@handle, /@handle/videos,
# /channel/UC..., or an old /c/Name or /user/Name link. The script resolves it
# to the channel's real ID automatically on first run and caches the result,
# so you never have to go hunting for channel IDs by hand.
#
# - url: the channel URL, pasted as-is
# - niche: your own grouping label (used for the dashboard filter and for
#     spotting cross-niche patterns) - keep these consistent, e.g. always
#     "hairloss" not sometimes "hair-loss"
# - name: optional — if you leave it out, the script fills it in from
#     YouTube automatically the first time it resolves the channel
# - since: optional — leave it out to track a channel's ENTIRE history.
#     Set it to a date ("YYYY-MM-DD") to limit that one channel to only its
#     videos from that date forward instead.

