# List every channel you want tracked here.
# - id: the channel's YouTube channel ID (starts with "UC...", NOT the @handle)
#     Find it by opening the channel, "About" tab -> "Share channel" -> "Copy channel ID",
#     or view page source and search for "channelId".
# - name: whatever you want to see on the dashboard / in alerts
# - niche: your own grouping label (used to spot cross-niche patterns) - keep these consistent

