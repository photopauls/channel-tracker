name: Weekly Title Suggestions

on:
  schedule:
    # Every Monday at 08:00 UTC. Edit the cron below to change day/time.
    - cron: "0 8 * * 1"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  # Same reasoning as the main tracker workflow: never let two runs of this
  # job race each other and fight over the same docs/title_suggestions.json
  # commit. A separate group from track.yml, so this can still run at the
  # same time as a tracker run without either waiting on the other.
  group: weekly-title-suggestions
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r scripts/requirements.txt

      - name: Generate title suggestions
        run: python scripts/weekly_titles.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit updated suggestions
        run: |
          git config user.name "channel-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/title_suggestions.json
          git diff --cached --quiet || git commit -m "Update weekly title suggestions [skip ci]"
          git pull --rebase --autostash origin main
          git push
