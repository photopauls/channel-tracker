name: Track YouTube Channels

on:
  schedule:
    # Every 6 hours. Edit the cron below to change frequency (fine to go hourly -
    # YouTube's free quota easily covers even 150 channels at this rate).
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  # Only one run of this workflow at a time. Without this, a manually
  # triggered run and a scheduled run (or two manual triggers back to back)
  # could overlap - both would check out the same starting point, both would
  # commit their own new data/tracker.db + docs/data.json, and whichever
  # finished second would get its push rejected because the remote had
  # already moved (exactly the "fetch first" / non-fast-forward error this
  # fixes). `cancel-in-progress: false` means an overlapping run queues and
  # waits its turn instead of getting cancelled outright, so no run's work is
  # thrown away.
  group: track-youtube-channels
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r scripts/requirements.txt

      - name: Run tracker
        run: python scripts/track.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated data
        run: |
          git config user.name "channel-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tracker.db docs/data.json
          git diff --cached --quiet || git commit -m "Update tracker data [skip ci]"
          # Someone may have pushed a commit (e.g. a code change, or channels.yaml
          # edited from the dashboard) while this run was busy calling the YouTube
          # API - rebase our data commit on top of whatever's newest before pushing,
          # instead of failing outright with a rejected/non-fast-forward push.
          git pull --rebase --autostash origin main
          git push
