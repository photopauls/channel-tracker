<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151d; --panel-2: #171b26; --border: #232838;
    --text: #eef0f5; --muted: #838a9c; --accent: #5b8cff; --accent-soft: #1a2540;
    --outlier: #ffa53e; --outlier-soft: #2c1d0c; --good: #38d996; --bad: #ff6767; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(circle at top, #131722 0%, var(--bg) 55%);
    color: var(--text); font-family: 'Inter', -apple-system, Segoe UI, Roboto, sans-serif;
    min-height: 100vh;
  }
  header { padding: 28px 28px 0; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.02em; }
  .tagline { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .stats-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; min-width: 130px; flex: 1; }
  .stat .num { font-size: 22px; font-weight: 800; }
  .stat .num.outlier-num { color: var(--outlier); }
  .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }

  .controls { max-width: 1400px; margin: 0 auto; padding: 0 28px 18px; display: flex; flex-wrap: wrap;
    gap: 10px; align-items: center; position: sticky; top: 0; z-index: 10; background: var(--bg);
    padding-top: 14px; border-bottom: 1px solid var(--border); }
  input[type=search], input[type=text], input[type=password] { background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 10px 14px; border-radius: 999px; font-size: 13px; font-family: inherit; }
  input[type=search] { width: 220px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  select { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px 12px;
    border-radius: 10px; font-size: 13px; font-family: inherit; }

  .pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { background: var(--panel); border: 1px solid var(--border); color: var(--muted); font-size: 12px;
    font-weight: 600; padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: .15s; white-space: nowrap; }
  .pill:hover { border-color: var(--accent); color: var(--text); }
  .pill.active { background: var(--accent); border-color: var(--accent); color: white; }

  .toggle { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border);
    padding: 9px 14px 9px 10px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .switch { width: 34px; height: 19px; background: var(--border); border-radius: 999px; position: relative;
    transition: .15s; flex-shrink: 0; }
  .switch::after { content: ''; position: absolute; width: 15px; height: 15px; border-radius: 50%; background: white;
    top: 2px; left: 2px; transition: .15s; }
  input:checked + .switch { background: var(--outlier); }
  input:checked + .switch::after { left: 17px; }
  .toggle input { display: none; }

  button { font-family: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); padding: 10px 16px; font-size: 13px; font-weight: 600; transition: .15s; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.secondary { background: transparent; color: var(--muted); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }

  .manage-wrap { max-width: 1400px; margin: 0 auto; padding: 16px 28px 0; }
  .manage-body { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; margin-top: 12px; display: flex; flex-direction: column; gap: 14px; }
  .manage-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .manage-row input { flex: 1; min-width: 160px; }
  .manage-status, .manage-msg { font-size: 12px; color: var(--muted); }
  .manage-msg:not(:empty) { color: var(--accent); }
  .channel-list { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
  .channel-row { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .channel-row-main { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 90px; }
  .channel-row-niche { color: var(--muted); font-size: 12px; background: var(--panel); padding: 2px 8px; border-radius: 999px; }
  .niche-input { width: 130px; padding: 6px 10px; font-size: 12px; border-radius: 999px; }
  .save-niche-btn, .del-btn { padding: 6px 12px; font-size: 12px; }
  .save-niche-btn:disabled { opacity: .4; cursor: default; }
  .manage-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px;
    max-width: 1400px; margin: 0 auto; padding: 22px 28px 48px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column; transition: transform .15s, border-color .15s; }
  .card:hover { transform: translateY(-2px); border-color: #34405e; }
  .card.outlier { border-color: var(--outlier); box-shadow: 0 0 0 1px var(--outlier), 0 8px 24px -8px rgba(255,165,62,.25); }
  .thumb-wrap { position: relative; }
  .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; display: block; }
  .ribbon { position: absolute; top: 10px; left: 10px; background: var(--outlier); color: #1a1200; font-weight: 800;
    font-size: 11px; padding: 4px 9px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .duration-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.8); color: #fff;
    font-size: 11px; font-weight: 700; padding: 2px 5px; border-radius: 4px; line-height: 1.4; }
  .fav-btn { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%;
    background: rgba(11,13,18,.65); border: 1px solid rgba(255,255,255,.15); color: #cfd3dd; font-size: 15px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; transition: .15s; }
  .fav-btn:hover { border-color: #ffd166; color: #ffd166; }
  .fav-btn.active { background: #ffd166; border-color: #ffd166; color: #1a1200; }
  .card-body { padding: 13px 15px 15px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .title { font-size: 14px; line-height: 1.4; font-weight: 600; text-decoration: none; color: var(--text); }
  .title:hover { color: var(--accent); }
  .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .meta .niche-tag { background: var(--panel-2); padding: 2px 8px; border-radius: 999px; font-size: 11px; }
  .meta .channel-link { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta .channel-link:hover { color: var(--text); text-decoration: underline; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: auto;
    padding-top: 10px; border-top: 1px solid var(--border); }
  .stat-item { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .stat-item .val { font-size: 16px; font-weight: 800; color: var(--text); line-height: 1.15;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-item .val.ratio-hi { color: var(--outlier); }
  .stat-item .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

  .view-tabs { margin-top: 4px; }

  .channels-view-wrap { max-width: 1400px; margin: 0 auto; padding: 22px 28px 48px; display: flex;
    flex-direction: column; gap: 22px; }
  .channel-group-title { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .channel-group-count { background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 1px 8px; font-size: 11px; }
  .channel-group-rows { display: flex; flex-direction: column; gap: 6px; }
  .channel-fav-row { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; font-size: 13px; }
  .channel-fav-btn { width: 30px; height: 30px; border-radius: 50%; background: var(--panel-2);
    border: 1px solid var(--border); color: #cfd3dd; font-size: 15px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0; }
  .channel-fav-btn:hover { border-color: #ffd166; color: #ffd166; }
  .channel-fav-btn.active { background: #ffd166; border-color: #ffd166; color: #1a1200; }
  .channel-fav-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .channel-fav-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .channel-fav-tags .niche-tag { background: var(--panel-2); padding: 2px 8px; border-radius: 999px; font-size: 11px; }
  .channel-fav-count { color: var(--muted); font-size: 12px; white-space: nowrap; }

  .suggestion-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .suggestion-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .suggestion-head h3 { margin: 0; font-size: 15px; font-weight: 800; }
  .suggestion-meta { color: var(--muted); font-size: 12px; }
  .suggestion-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .suggestion-tags .niche-tag { background: var(--panel-2); padding: 2px 8px; border-radius: 999px; font-size: 11px; }
  .suggestion-body { white-space: pre-wrap; font-size: 13px; line-height: 1.55; color: var(--text); }
  .suggestion-sources { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--border);
    padding-top: 10px; }
  .suggestion-sources summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .suggestion-source-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px;
    color: var(--muted); padding: 3px 0; }
  .suggestion-source-row .src-title { color: var(--text); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .suggestion-empty { color: var(--muted); font-size: 13px; }

  .empty, .loading { max-width: 1400px; margin: 0 auto; padding: 80px 28px; text-align: center; color: var(--muted); font-size: 14px; }
  .pagination { max-width: 1400px; margin: -12px auto 48px; padding: 0 28px; display: flex; align-items: center;
    justify-content: center; gap: 14px; }
  .pagination button:disabled { opacity: .4; cursor: default; }
  .pagination button:disabled:hover { border-color: var(--border); }
  .page-info { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Channel Tracker</h1>
  <div class="tagline" id="tagline">Loading…</div>
  <div class="stats-row" id="statsRow"></div>
  <div class="pill-row view-tabs" id="viewTabs">
    <button class="pill active" data-view="videos">Videos</button>
    <button class="pill" data-view="channels">Channels</button>
    <button class="pill" data-view="suggestions">Suggestions</button>
  </div>
</header>

<div id="videosView">
  <div class="controls">
    <input type="search" id="search" placeholder="Search titles…">
    <select id="channelFilter"><option value="">All channels</option></select>
    <select id="sortBy">
      <option value="published_desc">Newest first</option>
      <option value="ratio_desc">Biggest outperformance</option>
      <option value="views_desc">Most views</option>
    </select>
    <div class="pill-row" id="nichePills"></div>
    <label class="toggle">
      <input type="checkbox" id="outliersOnly">
      <span class="switch"></span>
      Outliers only
    </label>
    <label class="toggle">
      <input type="checkbox" id="favoritesOnly">
      <span class="switch"></span>
      Favourites only
    </label>
    <label class="toggle">
      <input type="checkbox" id="favChannelsOnly">
      <span class="switch"></span>
      Favourite channels only
    </label>
  </div>

  <div class="manage-wrap">
    <button id="manageToggle">⚙ Manage channels</button>
    <div class="manage-body" id="manageBody" hidden>
      <div class="manage-row">
        <input type="password" id="ghToken" placeholder="GitHub personal access token (repo scope)">
        <button class="primary" id="saveToken">Save token</button>
        <button class="secondary" id="clearToken">Forget token</button>
      </div>
      <div class="manage-status" id="tokenStatus">
        Token is stored only in this browser and used to edit channels.yaml directly on GitHub.
        <a href="https://github.com/settings/tokens/new" target="_blank" rel="noopener">Create one here</a> —
        classic token, "repo" scope is enough.
      </div>

      <div class="manage-row add-row">
        <input type="text" id="newUrl" placeholder="Channel URL, e.g. https://youtube.com/@handle">
        <input type="text" id="newTags" placeholder="Tags, comma separated">
        <input type="text" id="newName" placeholder="Name (optional)">
        <input type="text" id="newSince" placeholder="Since YYYY-MM-DD (optional)">
        <button class="primary" id="addChannelBtn">Add channel</button>
      </div>

      <div class="manage-msg" id="manageMsg"></div>
      <datalist id="nicheOptions"></datalist>
      <button class="secondary" id="showChannelListBtn">Show tracked channels ▾</button>
      <div class="channel-list" id="channelList" hidden></div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No videos match these filters.</div>
  <div class="pagination" id="pagination" style="display:none">
    <button id="prevPageBtn">← Prev</button>
    <span class="page-info" id="pageInfo"></span>
    <button id="nextPageBtn">Next →</button>
  </div>
</div>

<div id="channelsView" hidden>
  <div class="channels-view-wrap" id="channelsList"></div>
</div>

<div id="suggestionsView" hidden>
  <div class="channels-view-wrap" id="suggestionsList"></div>
</div>

<script>
// ---- dashboard data ----
let DATA = { videos: [], channels: [], niches: [] };
let activeNiches = new Set(); // empty set = "all niches"

// Weekly per-profile title suggestions, written by scripts/weekly_titles.py
// (its own scheduled workflow, separate from the main tracker) into
// docs/title_suggestions.json. Read-only here - the Suggestions tab has
// nothing to write back, it's purely a viewer for that file.
let SUGGESTIONS = { generated_at: null, profiles: [] };
async function loadSuggestions() {
  try {
    const res = await fetch('title_suggestions.json', { cache: 'no-store' });
    if (res.ok) SUGGESTIONS = await res.json();
  } catch (e) { /* offline, or the weekly job hasn't run yet - empty state stands */ }
}

// Favourites live in two places. localStorage always has them, instantly, on
// this one browser - that's what keeps working with no setup at all. If a
// GitHub token is saved (the same one used for channel management below),
// they're ALSO synced to a small favorites.json file committed to the repo,
// which is what makes them survive clearing this browser's storage or show up
// on a different device. Reading favorites.json needs no token at all (it
// sits right next to data.json on the published site) - only writing a
// change to it does.
function getFavorites() {
  try { return new Set(JSON.parse(localStorage.getItem('favVideos') || '[]')); } catch (e) { return new Set(); }
}
function saveFavoritesLocal(set) {
  try { localStorage.setItem('favVideos', JSON.stringify([...set])); } catch (e) {}
}
let favorites = getFavorites();

// Pulls in whatever's committed to favorites.json (if anything) and merges it
// into the local set, so a favourite added on another device - or before this
// browser's storage was cleared - shows up here too. Call this once at load,
// before the stats row and grid first render.
async function syncFavoritesFromRepo() {
  try {
    const res = await fetch('favorites.json', { cache: 'no-store' });
    if (res.ok) {
      const remote = await res.json();
      if (Array.isArray(remote)) {
        remote.forEach(vid => favorites.add(vid));
        saveFavoritesLocal(favorites);
      }
    }
  } catch (e) { /* offline, or favorites.json doesn't exist yet - local set stands as-is */ }
}

// Fire-and-forget commit of the current favourites set to the repo. Silently
// does nothing without a saved token - favourites still work, they just stay
// local to this browser until a token's saved, same tradeoff as channel
// management below.
async function commitFavorites() {
  if (!getToken()) return;
  try {
    const { sha } = await ghGetJsonFile(FAVORITES_PATH);
    await ghPutJsonFile(FAVORITES_PATH, [...favorites].sort(), sha, 'Update favourites');
  } catch (e) {
    console.warn('Could not sync favourites to GitHub:', e.message);
  }
}

function toggleFavorite(vid) {
  if (favorites.has(vid)) favorites.delete(vid); else favorites.add(vid);
  saveFavoritesLocal(favorites);
  const favStat = document.getElementById('favStatNum');
  if (favStat) favStat.textContent = favorites.size;
  // If "favourites only" is on, toggling one off should remove it from the list -
  // that needs a full re-filter. Otherwise just repaint (keeps your current page
  // and scroll position instead of jumping back to the top).
  if (document.getElementById('favoritesOnly').checked) render(); else paintGrid();
  commitFavorites();
}

// Favourite CHANNELS work exactly like favourite videos above (local storage
// first, synced to a small committed JSON file once a token's saved) - just
// keyed by channel name instead of video ID, and toggled from the "Channels"
// view rather than from a button on each card. "Favourite channels only" in
// the Videos view then shows every video from any favourited channel.
function getFavoriteChannels() {
  try { return new Set(JSON.parse(localStorage.getItem('favChannels') || '[]')); } catch (e) { return new Set(); }
}
function saveFavoriteChannelsLocal(set) {
  try { localStorage.setItem('favChannels', JSON.stringify([...set])); } catch (e) {}
}
let favoriteChannels = getFavoriteChannels();

async function syncFavoriteChannelsFromRepo() {
  try {
    const res = await fetch('favorite_channels.json', { cache: 'no-store' });
    if (res.ok) {
      const remote = await res.json();
      if (Array.isArray(remote)) {
        remote.forEach(name => favoriteChannels.add(name));
        saveFavoriteChannelsLocal(favoriteChannels);
      }
    }
  } catch (e) { /* offline, or favorite_channels.json doesn't exist yet */ }
}

async function commitFavoriteChannels() {
  if (!getToken()) return;
  try {
    const { sha } = await ghGetJsonFile(FAVORITE_CHANNELS_PATH);
    await ghPutJsonFile(FAVORITE_CHANNELS_PATH, [...favoriteChannels].sort(), sha, 'Update favourite channels');
  } catch (e) {
    console.warn('Could not sync favourite channels to GitHub:', e.message);
  }
}

function toggleFavoriteChannel(name) {
  if (favoriteChannels.has(name)) favoriteChannels.delete(name); else favoriteChannels.add(name);
  saveFavoriteChannelsLocal(favoriteChannels);
  const favStat = document.getElementById('favChannelsStatNum');
  if (favStat) favStat.textContent = favoriteChannels.size;
  renderChannelsView();
  const favChannelsOnly = document.getElementById('favChannelsOnly');
  if (favChannelsOnly && favChannelsOnly.checked) render();
  commitFavoriteChannels();
}

// ---- channels view (grouped by tag, with the favourite-channel toggle) ----
function computeChannelIndex() {
  const idx = new Map(); // channel name -> { tags: Set, count: number }
  DATA.videos.forEach(v => {
    if (!idx.has(v.channel_name)) idx.set(v.channel_name, { tags: new Set(), count: 0 });
    const entry = idx.get(v.channel_name);
    (v.tags && v.tags.length ? v.tags : ['uncategorized']).forEach(t => entry.tags.add(t));
    entry.count++;
  });
  return idx;
}

function renderChannelsView() {
  const container = document.getElementById('channelsList');
  const idx = computeChannelIndex();

  const byTag = new Map();
  idx.forEach((info, name) => {
    [...info.tags].forEach(t => {
      if (!byTag.has(t)) byTag.set(t, []);
      byTag.get(t).push(name);
    });
  });

  const tags = [...byTag.keys()].sort();
  container.innerHTML = tags.map(tag => {
    const names = byTag.get(tag).sort((a, b) => a.localeCompare(b));
    return `
      <div class="channel-group">
        <h3 class="channel-group-title">${escapeHtml(tag)} <span class="channel-group-count">${names.length}</span></h3>
        <div class="channel-group-rows">
          ${names.map(name => {
            const info = idx.get(name);
            const isFav = favoriteChannels.has(name);
            return `
              <div class="channel-fav-row">
                <button class="channel-fav-btn${isFav ? ' active' : ''}" data-channel="${escapeHtml(name)}" title="Toggle favourite channel">${isFav ? '★' : '☆'}</button>
                <span class="channel-fav-name">${escapeHtml(name)}</span>
                <span class="channel-fav-tags">${[...info.tags].map(t => `<span class="niche-tag">${escapeHtml(t)}</span>`).join('')}</span>
                <span class="channel-fav-count">${info.count} video${info.count === 1 ? '' : 's'}</span>
              </div>`;
          }).join('')}
        </div>
      </div>`;
  }).join('') || '<div class="manage-empty">No channels tracked yet.</div>';

  container.querySelectorAll('.channel-fav-btn').forEach(btn => {
    btn.onclick = () => toggleFavoriteChannel(btn.dataset.channel);
  });
}

// ---- suggestions view (weekly, read-only viewer for title_suggestions.json) ----
function renderSuggestionsView() {
  const container = document.getElementById('suggestionsList');
  const profiles = SUGGESTIONS.profiles || [];

  if (!profiles.length) {
    container.innerHTML = '<div class="suggestion-empty">No suggestions yet. Add profiles to profiles.yaml ' +
      'and the weekly job will start filling this in after its next scheduled run (or trigger ' +
      '"Weekly Title Suggestions" from the Actions tab to run it now).</div>';
    return;
  }

  const generatedTxt = SUGGESTIONS.generated_at ? new Date(SUGGESTIONS.generated_at).toLocaleString() : 'never';
  container.innerHTML = profiles.map(p => {
    const tagsHtml = (p.tags || []).map(t => `<span class="niche-tag">${escapeHtml(t)}</span>`).join('');
    const sources = p.source_outliers || [];
    const sourcesHtml = sources.length ? `
      <details class="suggestion-sources">
        <summary>${sources.length} outlier${sources.length === 1 ? '' : 's'} this drew from</summary>
        ${sources.map(s => `
          <div class="suggestion-source-row">
            <span class="src-title">${escapeHtml(s.title)} — ${escapeHtml(s.channel_name)}</span>
            <span>${s.ratio != null ? s.ratio + '×' : 'n/a'} · ${s.views != null ? s.views.toLocaleString() + ' views' : ''}</span>
          </div>`).join('')}
      </details>` : '';
    const bodyHtml = p.suggestions
      ? `<div class="suggestion-body">${escapeHtml(p.suggestions)}</div>`
      : `<div class="suggestion-empty">No suggestions generated this run` +
        `${p.matched_outlier_count ? '' : ' — nothing matched this profile\'s tags in the last 7 days'}.</div>`;
    return `
      <div class="suggestion-card">
        <div class="suggestion-head">
          <h3>${escapeHtml(p.name)}</h3>
          <span class="suggestion-meta">Generated ${escapeHtml(generatedTxt)} · ${p.matched_outlier_count || 0} matching outlier${p.matched_outlier_count === 1 ? '' : 's'}</span>
        </div>
        <div class="suggestion-tags">${tagsHtml}</div>
        ${bodyHtml}
        ${sourcesHtml}
      </div>`;
  }).join('');
}

function setView(view) {
  document.getElementById('videosView').hidden = view !== 'videos';
  document.getElementById('channelsView').hidden = view !== 'channels';
  document.getElementById('suggestionsView').hidden = view !== 'suggestions';
  document.querySelectorAll('.view-tabs .pill').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  if (view === 'channels') renderChannelsView();
  if (view === 'suggestions') renderSuggestionsView();
}
document.querySelectorAll('.view-tabs .pill').forEach(b => {
  b.onclick = () => setView(b.dataset.view);
});

async function load() {
  try {
    const [res] = await Promise.all([
      fetch('data.json', { cache: 'no-store' }),
      syncFavoritesFromRepo(),
      syncFavoriteChannelsFromRepo(),
      loadSuggestions(),
    ]);
    DATA = await res.json();
  } catch (e) {
    document.getElementById('tagline').textContent = "No data yet — the tracker hasn't run successfully yet.";
    return;
  }

  if (!DATA.generated_at) {
    document.getElementById('tagline').textContent = "No data yet — waiting on the first tracker run.";
    return;
  }

  const outlierCount = DATA.videos.filter(v => v.is_outlier).length;
  document.getElementById('tagline').textContent =
    `Last updated ${new Date(DATA.generated_at).toLocaleString()}`;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${DATA.channel_count ?? DATA.channels.length}</div><div class="label">Channels tracked</div></div>
    <div class="stat"><div class="num">${DATA.videos.length}</div><div class="label">Videos tracked</div></div>
    <div class="stat"><div class="num outlier-num">${outlierCount}</div><div class="label">Current outliers</div></div>
    <div class="stat"><div class="num">${DATA.niches.length}</div><div class="label">Tags</div></div>
    <div class="stat"><div class="num" id="favStatNum" style="color:#ffd166">${favorites.size}</div><div class="label">Favourited</div></div>
    <div class="stat"><div class="num" id="favChannelsStatNum" style="color:#ffd166">${favoriteChannels.size}</div><div class="label">Favourite channels</div></div>
  `;

  const chSel = document.getElementById('channelFilter');
  DATA.channels.forEach(c => chSel.add(new Option(c, c)));

  buildNichePills();
  render();
}

function buildNichePills() {
  const pillRow = document.getElementById('nichePills');
  pillRow.innerHTML = '';

  const allPill = document.createElement('div');
  allPill.className = 'pill' + (activeNiches.size === 0 ? ' active' : '');
  allPill.textContent = 'All tags';
  allPill.onclick = () => { activeNiches.clear(); buildNichePills(); render(); };
  pillRow.appendChild(allPill);

  DATA.niches.forEach(n => {
    const p = document.createElement('div');
    p.className = 'pill' + (activeNiches.has(n) ? ' active' : '');
    p.textContent = n;
    p.onclick = () => {
      if (activeNiches.has(n)) activeNiches.delete(n); else activeNiches.add(n);
      buildNichePills();
      render();
    };
    pillRow.appendChild(p);
  });
}

const PAGE_SIZE = 60;
let currentRows = [];
let currentPage = 1;

// Recomputes the filtered/sorted list from scratch and resets to page 1.
// Call this whenever a filter, sort, or search control changes.
function render() {
  const channel = document.getElementById('channelFilter').value;
  const outliersOnly = document.getElementById('outliersOnly').checked;
  const favoritesOnly = document.getElementById('favoritesOnly').checked;
  const favChannelsOnly = document.getElementById('favChannelsOnly').checked;
  const sortBy = document.getElementById('sortBy').value;
  const q = document.getElementById('search').value.trim().toLowerCase();

  let rows = DATA.videos.filter(v =>
    (!channel || v.channel_name === channel) &&
    (activeNiches.size === 0 || (v.tags || []).some(t => activeNiches.has(t))) &&
    (!outliersOnly || v.is_outlier) &&
    (!favoritesOnly || favorites.has(v.video_id)) &&
    (!favChannelsOnly || favoriteChannels.has(v.channel_name)) &&
    (!q || v.title.toLowerCase().includes(q))
  );

  if (sortBy === 'ratio_desc') rows.sort((a, b) => (b.ratio || 0) - (a.ratio || 0));
  else if (sortBy === 'views_desc') rows.sort((a, b) => b.views - a.views);
  else rows.sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

  currentRows = rows;
  currentPage = 1;
  paintGrid();
}

// Paints only the current page's worth of cards from the already-filtered
// currentRows - this is what keeps the page fast even with thousands of
// tracked videos, and (unlike a "load more" button) the DOM never grows past
// one page's worth of cards no matter how far you page through.
function paintGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  document.getElementById('empty').style.display = currentRows.length ? 'none' : 'block';

  const totalPages = Math.max(1, Math.ceil(currentRows.length / PAGE_SIZE));
  currentPage = Math.min(Math.max(currentPage, 1), totalPages);
  const start = (currentPage - 1) * PAGE_SIZE;
  const slice = currentRows.slice(start, start + PAGE_SIZE);
  const frag = document.createDocumentFragment();
  for (const v of slice) {
    const card = document.createElement('div');
    card.className = 'card' + (v.is_outlier ? ' outlier' : '');
    card.innerHTML = `
      <div class="thumb-wrap">
        <img class="thumb" src="${v.thumbnail}" loading="lazy" alt="">
        ${v.duration ? `<span class="duration-badge">${v.duration}</span>` : ''}
        ${v.is_outlier ? `<span class="ribbon">${v.ratio}× baseline</span>` : ''}
        <button class="fav-btn${favorites.has(v.video_id) ? ' active' : ''}" data-vid="${v.video_id}" title="Toggle favourite">${favorites.has(v.video_id) ? '★' : '☆'}</button>
      </div>
      <div class="card-body">
        <a class="title" href="${v.url}" target="_blank" rel="noopener">${escapeHtml(v.title)}</a>
        <div class="meta"><span class="channel-link" data-channel="${escapeHtml(v.channel_name)}" title="View only this channel">${escapeHtml(v.channel_name)}</span>${(v.tags || []).map(t => `<span class="niche-tag">${escapeHtml(t)}</span>`).join('')}</div>
        <div class="stats">
          <div class="stat-item"><span class="val">${v.views.toLocaleString()}</span><span class="lbl">Views</span></div>
          <div class="stat-item"><span class="val">${v.days_since_upload}d</span><span class="lbl">Old</span></div>
          <div class="stat-item"><span class="val">${v.velocity}/day</span><span class="lbl">Velocity</span></div>
          <div class="stat-item"><span class="val${v.is_outlier ? ' ratio-hi' : ''}">${v.ratio != null ? v.ratio + '×' : 'n/a'}</span><span class="lbl">Baseline</span></div>
        </div>
      </div>`;
    frag.appendChild(card);
  }
  grid.appendChild(frag);

  const pagination = document.getElementById('pagination');
  const prevBtn = document.getElementById('prevPageBtn');
  const nextBtn = document.getElementById('nextPageBtn');
  if (currentRows.length > PAGE_SIZE) {
    pagination.style.display = 'flex';
    document.getElementById('pageInfo').textContent =
      `Page ${currentPage} of ${totalPages} (${currentRows.length} videos)`;
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= totalPages;
  } else {
    pagination.style.display = 'none';
  }
}

function goToPage(delta) {
  currentPage += delta;
  paintGrid();
  document.querySelector('.controls').scrollIntoView({ behavior: 'instant', block: 'start' });
}
document.getElementById('prevPageBtn').addEventListener('click', () => goToPage(-1));
document.getElementById('nextPageBtn').addEventListener('click', () => goToPage(1));

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

['channelFilter', 'sortBy'].forEach(id => document.getElementById(id).addEventListener('change', render));
document.getElementById('outliersOnly').addEventListener('change', render);
document.getElementById('favoritesOnly').addEventListener('change', render);
document.getElementById('favChannelsOnly').addEventListener('change', render);
document.getElementById('search').addEventListener('input', render);
document.getElementById('grid').addEventListener('click', (e) => {
  const btn = e.target.closest('.fav-btn');
  if (btn) { e.preventDefault(); toggleFavorite(btn.dataset.vid); return; }
  const link = e.target.closest('.channel-link');
  if (link) {
    document.getElementById('channelFilter').value = link.dataset.channel;
    render();
    document.querySelector('.controls').scrollIntoView({ behavior: 'instant', block: 'start' });
  }
});

// ---- manage channels (reads/writes channels.yaml on GitHub directly) ----
const REPO_OWNER = "photopauls";
const REPO_NAME = "channel-tracker";
const CHANNELS_PATH = "channels.yaml";
const FAVORITES_PATH = "docs/favorites.json"; // sits next to data.json, so anyone viewing the
                                                // published site can read it with no token -
                                                // only WRITING a change needs the GitHub token,
                                                // same as channel management below.
const FAVORITE_CHANNELS_PATH = "docs/favorite_channels.json"; // same deal, for favourite channels

function getToken() { try { return localStorage.getItem('ghToken') || ''; } catch (e) { return ''; } }
function setToken(t) { try { localStorage.setItem('ghToken', t); } catch (e) {} }
function clearStoredToken() { try { localStorage.removeItem('ghToken'); } catch (e) {} }

function b64EncodeUnicode(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function b64DecodeUnicode(str) {
  const binary = atob(str.replace(/\n/g, ''));
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

async function ghGetFile() {
  const token = getToken();
  const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CHANNELS_PATH}`, {
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' },
    cache: 'no-store',
  });
  if (!res.ok) throw new Error(`GitHub fetch failed (${res.status}) - check your token and repo access`);
  const data = await res.json();
  const content = b64DecodeUnicode(data.content);
  const parsed = jsyaml.load(content) || {};
  if (!Array.isArray(parsed.channels)) parsed.channels = [];
  return { sha: data.sha, parsed };
}

async function ghPutFile(parsed, sha, message) {
  const token = getToken();
  const header = "# Managed by the dashboard's \"Manage channels\" panel - also editable by hand.\n" +
    "# Paste a channel URL (any format: @handle, /channel/UC..., /c/Name, /user/Name).\n" +
    "# tags = your own grouping labels, a channel can have more than one. name is optional (auto-filled from YouTube if left out).\n" +
    "# since: YYYY-MM-DD is optional - limits that one channel to videos from that date forward;\n" +
    "# leave it out to track a channel's entire history.\n\n";
  const yamlBody = jsyaml.dump(parsed, { lineWidth: -1 });
  const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CHANNELS_PATH}`, {
    method: 'PUT',
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, content: b64EncodeUnicode(header + yamlBody), sha }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `GitHub write failed (${res.status})`);
  }
}

// Generic versions of the two functions above for any small JSON file in the
// repo (used for favorites.json) - same GitHub Contents API, just without the
// YAML parsing/serializing or the channels.yaml-specific header comment.
async function ghGetJsonFile(path) {
  const token = getToken();
  const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' },
    cache: 'no-store',
  });
  if (res.status === 404) return { sha: null, data: null }; // file doesn't exist yet - fine
  if (!res.ok) throw new Error(`GitHub fetch failed (${res.status})`);
  const data = await res.json();
  return { sha: data.sha, data: JSON.parse(b64DecodeUnicode(data.content)) };
}

async function ghPutJsonFile(path, obj, sha, message) {
  const token = getToken();
  const body = { message, content: b64EncodeUnicode(JSON.stringify(obj, null, 2) + "\n") };
  if (sha) body.sha = sha;
  const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
    method: 'PUT',
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `GitHub write failed (${res.status})`);
  }
}

// A channel entry can carry its tags either as a new 'tags: [a, b]' list or the
// old single 'niche: x' string (or, in principle, both) - this reads whichever
// is there and always hands back a clean array, so the rest of the panel never
// has to care which form a given channel was saved in.
function channelTagsOf(c) {
  const tags = [];
  (Array.isArray(c.tags) ? c.tags : []).forEach(t => {
    t = String(t).trim();
    if (t && !tags.includes(t)) tags.push(t);
  });
  if (c.niche) {
    const n = String(c.niche).trim();
    if (n && !tags.includes(n)) tags.push(n);
  }
  return tags;
}

// Turns a "hairloss, competitors" input into ["hairloss", "competitors"] -
// trims each one, drops empties, and de-dupes.
function parseTagsInput(str) {
  return [...new Set((str || '').split(',').map(s => s.trim()).filter(Boolean))];
}

async function refreshChannelList() {
  const listEl = document.getElementById('channelList');
  const msgEl = document.getElementById('manageMsg');
  if (!getToken()) { listEl.innerHTML = ''; return; }
  listEl.innerHTML = '<div class="manage-empty">Loading…</div>';
  try {
    const { parsed } = await ghGetFile();
    const channels = parsed.channels;

    const allTags = [...new Set(channels.flatMap(channelTagsOf))].sort();
    document.getElementById('nicheOptions').innerHTML = allTags.map(n => `<option value="${escapeHtml(n)}">`).join('');

    listEl.innerHTML = channels.length ? channels.map((c, i) => `
      <div class="channel-row">
        <span class="channel-row-main">${escapeHtml(c.name || c.url || c.id || '(unnamed)')}</span>
        <input class="niche-input" list="nicheOptions" data-index="${i}" placeholder="Tags, comma separated" value="${escapeHtml(channelTagsOf(c).join(', '))}">
        <button class="save-niche-btn" data-index="${i}" disabled>Save</button>
        <button class="del-btn danger" data-index="${i}">Remove</button>
      </div>`).join('') : '<div class="manage-empty">No channels yet.</div>';

    listEl.querySelectorAll('.del-btn').forEach(btn => {
      btn.onclick = () => deleteChannel(parseInt(btn.dataset.index, 10));
    });
    listEl.querySelectorAll('.niche-input').forEach(input => {
      const saveBtn = listEl.querySelector(`.save-niche-btn[data-index="${input.dataset.index}"]`);
      input.addEventListener('input', () => { saveBtn.disabled = false; });
    });
    listEl.querySelectorAll('.save-niche-btn').forEach(btn => {
      btn.onclick = () => saveTags(parseInt(btn.dataset.index, 10), btn);
    });
    msgEl.textContent = '';
  } catch (e) {
    listEl.innerHTML = '';
    msgEl.textContent = 'Could not load channels.yaml: ' + e.message;
  }
}

async function saveTags(index, btn) {
  const msgEl = document.getElementById('manageMsg');
  const input = document.querySelector(`.niche-input[data-index="${index}"]`);
  const tags = parseTagsInput(input.value);
  if (!tags.length) { msgEl.textContent = 'At least one tag is required.'; return; }
  btn.disabled = true;
  msgEl.textContent = 'Saving…';
  try {
    const { parsed, sha } = await ghGetFile();
    if (!parsed.channels[index]) throw new Error('Channel list changed since this loaded - reopen the panel and try again.');
    const name = parsed.channels[index].name || parsed.channels[index].url || 'channel';
    parsed.channels[index].tags = tags;
    delete parsed.channels[index].niche; // fully migrated to the tags list on save
    await ghPutFile(parsed, sha, `Retag channel: ${name} -> ${tags.join(', ')}`);
    msgEl.textContent = "Saved. It'll show up on the dashboard after the next tracker run.";
    refreshChannelList();
  } catch (e) {
    msgEl.textContent = 'Failed to save tags: ' + e.message;
    btn.disabled = false;
  }
}

async function addChannel() {
  const msgEl = document.getElementById('manageMsg');
  const url = document.getElementById('newUrl').value.trim();
  const tags = parseTagsInput(document.getElementById('newTags').value);
  const name = document.getElementById('newName').value.trim();
  const since = document.getElementById('newSince').value.trim();
  if (!url || !tags.length) { msgEl.textContent = 'URL and at least one tag are both required.'; return; }
  if (!getToken()) { msgEl.textContent = 'Save a GitHub token above first.'; return; }
  msgEl.textContent = 'Adding…';
  try {
    const { parsed, sha } = await ghGetFile();
    const entry = { url, tags };
    if (name) entry.name = name;
    if (since) entry.since = since;
    parsed.channels.push(entry);
    await ghPutFile(parsed, sha, `Add channel: ${name || url}`);
    msgEl.textContent = "Added. It'll show up on the dashboard after the next tracker run.";
    document.getElementById('newUrl').value = '';
    document.getElementById('newTags').value = '';
    document.getElementById('newName').value = '';
    document.getElementById('newSince').value = '';
    refreshChannelList();
  } catch (e) {
    msgEl.textContent = 'Failed to add: ' + e.message;
  }
}

async function deleteChannel(index) {
  const msgEl = document.getElementById('manageMsg');
  if (!confirm('Remove this channel from tracking? (Its history stays in the database, it just stops updating.)')) return;
  msgEl.textContent = 'Removing…';
  try {
    const { parsed, sha } = await ghGetFile();
    const removed = parsed.channels.splice(index, 1)[0];
    await ghPutFile(parsed, sha, `Remove channel: ${(removed && (removed.name || removed.url)) || 'unknown'}`);
    msgEl.textContent = 'Removed.';
    refreshChannelList();
  } catch (e) {
    msgEl.textContent = 'Failed to remove: ' + e.message;
  }
}

document.getElementById('addChannelBtn').onclick = addChannel;
document.getElementById('manageToggle').onclick = () => {
  const body = document.getElementById('manageBody');
  body.hidden = !body.hidden;
};
document.getElementById('showChannelListBtn').onclick = () => {
  const listEl = document.getElementById('channelList');
  const btn = document.getElementById('showChannelListBtn');
  listEl.hidden = !listEl.hidden;
  btn.textContent = listEl.hidden ? 'Show tracked channels ▾' : 'Hide tracked channels ▴';
  if (!listEl.hidden) refreshChannelList();
};
document.getElementById('saveToken').onclick = () => {
  const t = document.getElementById('ghToken').value.trim();
  if (!t) return;
  setToken(t);
  document.getElementById('ghToken').value = '';
  document.getElementById('tokenStatus').textContent = 'Token saved in this browser.';
  refreshChannelList();
};
document.getElementById('clearToken').onclick = () => {
  clearStoredToken();
  document.getElementById('channelList').innerHTML = '';
  document.getElementById('tokenStatus').textContent = 'Token removed from this browser.';
};
if (getToken()) {
  document.getElementById('tokenStatus').textContent = 'Token saved in this browser.';
}

load();
</script>
